[project]
name = "edutap.pass_builder_api"
version = "0.2.0"
description = "Pythonic async client for the edutap.pass_builder REST service."
readme = "README.md"
# 3.13, nicht 3.12: `edutap.data_models` verlangt es. Der Dienst, gegen den dieser
# Client spricht, ist im selben Zug mitgezogen.
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = { text = "EUPL 1.2" }
authors = [{ name = "Alexander Loechel", email = "Alexander.Loechel@lmu.de" }]
keywords = ["edutap", "wallet", "pass", "client"]
dependencies = [
    # The shared vocabulary. `WalletType` lives there, not here -- a copy of a shared
    # enum is a second truth, and the copy that stood in `models.py` was on the coarse
    # provider axis and could not express VAS versus Access.
    "edutap.data_models>=0.3,<0.4",
    "httpx",
    "pydantic>=2",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "anyio",
    "ruff",
    "ty",
    "pdbp",
]

[project.urls]
Source = "https://github.com/edutap-collective/edutap.pass_builder_api"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["edutap*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
markers = ["drift: spec-drift checks against the vendored server OpenAPI snapshot"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D", "S", "B", "UP"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D"]
"docs/conf.py" = ["D100"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
