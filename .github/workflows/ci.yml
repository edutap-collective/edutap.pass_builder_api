name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Callable, so a release workflow runs these checks rather than a copy of them.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mirrors requires-python in pyproject.toml, and has to: `uv sync` refuses
        # an interpreter the project excludes, so a stale entry here fails the job
        # before a single test runs.
        #
        # 3.12 IS GONE because `edutap.data_models` requires 3.13. Not a preference:
        # 3.12 is supported until 2028, but this package cannot be installed on it.
        python-version: ["3.13", "3.14"]
    env:
      # uv reads this, so no step needs a version-specific flag.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # One environment, managed by uv. The previous version used three: it
      # installed an interpreter, then wrote the package into the runner's
      # system Python with --system -- which Ubuntu marks as externally
      # managed, so the job died there -- and then ran the tests in a third.
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q
